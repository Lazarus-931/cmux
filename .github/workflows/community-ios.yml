name: Community iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/community-ios"
    tags:
      - "community-ios-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh
          DEVELOPER_DIR="$(sed -n 's/^DEVELOPER_DIR=//p' "$GITHUB_ENV" | tail -n 1)" \
            xcrun --sdk iphoneos --show-sdk-path

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Provision GhosttyKit
        run: ./scripts/ensure-ghosttykit.sh

      - name: Build and verify unsigned IPA
        run: |
          ios/scripts/build-community-ipa.sh \
            --skip-ghosttykit \
            --output "$RUNNER_TEMP/cmux-community-ios.ipa"
          printf '{"repository":"%s","commit":"%s","license":"GPL-3.0-or-later","signed":false}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/cmux-community-ios-source.json"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-community-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cmux-community-ios.ipa
            ${{ runner.temp }}/cmux-community-ios-source.json
          if-no-files-found: error

      - name: Publish tagged community release
        if: startsWith(github.ref, 'refs/tags/community-ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/cmux-community-ios.ipa" \
            "$RUNNER_TEMP/cmux-community-ios-source.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cmux Community iOS ${GITHUB_REF_NAME#community-ios-v}" \
            --notes "Unofficial unsigned GPL community build. Re-sign the IPA for your own device before installing. No cmux Pro subscription is required for local Mac pairing."
